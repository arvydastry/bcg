<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Demo: Baltic Contracting Group ir Skanlika</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F4F6F9; color: #0F1720; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(760px, calc(100% - 32px)); padding: 48px 0; }
    h1 { font-size: 1.6rem; margin: 0 0 6px; }
    p { color: #5E6B7A; margin: 0 0 28px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    a.site { display: grid; gap: 14px; padding: 28px; border-radius: 20px; background: #fff; border: 1px solid #D9E0E8; color: inherit; text-decoration: none; transition: transform .3s, box-shadow .3s; }
    a.site:hover { transform: translateY(-4px); box-shadow: 0 18px 40px rgba(12, 30, 51, .12); }
    a.site img { height: 30px; width: auto; justify-self: start; }
    a.site span { color: #5E6B7A; font-size: .92rem; }
    a.site strong { font-size: .9rem; }
    .bcg strong { color: #1B4E9B; } .sk strong { color: #0F7C7A; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Dvi atskiros svetainės</h1>
    <p>Demo peržiūra. Pasirinkite įmonės svetainę. Ši pasirinkimo kortelė skirta tik peržiūrai ir į galutines svetaines nekeliama.</p>
    <div class="grid">
      <a class="site bcg" href="bcg/index.html"><img src="bcg/assets/img/logo/bcg-ink.png" alt="Baltic Contracting Group"><span>Skandinavija ir Beniliuksas · nuo 2013 m.</span><strong>baltcontract.eu →</strong></a>
      <a class="site sk" href="skanlika/index.html"><img src="skanlika/assets/img/logo/skanlika-ink.png" alt="Skanlika"><span>Jungtinė Karalystė ir Airija · nuo 2003 m.</span><strong>skanlika.com →</strong></a>
    </div>
  </main>
</body>
</html>
